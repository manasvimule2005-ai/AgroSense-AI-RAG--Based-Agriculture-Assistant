<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1F4D3A" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B57" />
      <stop offset="100%" stop-color="#0F2B1D" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="#F7F3E8" stroke="#1F4D3A" stroke-width="4" />
  <!-- AI Circuit Nodes -->
  <circle cx="50" cy="70" r="5" fill="#2E8B57" />
  <circle cx="150" cy="70" r="5" fill="#2E8B57" />
  <circle cx="100" cy="35" r="6" fill="#1F4D3A" />
  <path d="M50 70 L100 35 L150 70" stroke="#2E8B57" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
  <!-- Central Sprout / Plant -->
  <path d="M100 160 C100 120 70 100 65 75 C85 75 100 95 100 120 C100 95 115 75 135 75 C130 100 100 120 100 160 Z" fill="url(#leafGrad)" />
  <!-- Sprout Stem Rib -->
  <path d="M100 160 L100 85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <!-- Base Soil Arc -->
  <path d="M60 160 Q100 175 140 160" stroke="#1F4D3A" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>
